<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Manrope, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Компонентная архитектура ФСП Талант">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b0f73"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7a9b"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="20" y="30" font-size="17" font-weight="700" fill="#1d1428">Компонентная архитектура ФСП Талант</text>
  <text x="20" y="50" font-size="12" fill="#6b5c7b">Пунктир — граница docker-compose; серые стрелки — внешние системы (боевой Keycloak ФСП, ATS работодателя)</text>

  <!-- браузер -->
  <rect x="20" y="78" width="170" height="122" rx="10" fill="#f7f2fc" stroke="#9b5fd0"/>
  <text x="105" y="102" font-size="14" font-weight="700" fill="#3d0c63" text-anchor="middle">Браузер</text>
  <text x="105" y="122" font-size="12" fill="#1d1428" text-anchor="middle">SPA: React + TypeScript</text>
  <text x="105" y="146" font-size="11.5" fill="#6b5c7b" text-anchor="middle">кабинет кандидата</text>
  <text x="105" y="164" font-size="11.5" fill="#6b5c7b" text-anchor="middle">кабинет работодателя</text>
  <text x="105" y="182" font-size="11.5" fill="#6b5c7b" text-anchor="middle">страница входа ФСП ID</text>

  <!-- граница compose -->
  <rect x="220" y="66" width="520" height="300" rx="12" fill="none" stroke="#b9a6cf" stroke-dasharray="6 5"/>
  <text x="730" y="84" font-size="11" fill="#8a7a9b" text-anchor="end">docker-compose</text>

  <!-- nginx -->
  <rect x="240" y="96" width="120" height="86" rx="10" fill="#efe6f8" stroke="#7a35b0"/>
  <text x="300" y="124" font-size="14" font-weight="700" fill="#3d0c63" text-anchor="middle">nginx</text>
  <text x="300" y="144" font-size="11.5" fill="#6b5c7b" text-anchor="middle">статика SPA</text>
  <text x="300" y="162" font-size="11.5" fill="#6b5c7b" text-anchor="middle">/api · /fsp</text>

  <!-- backend -->
  <rect x="410" y="86" width="190" height="168" rx="10" fill="#5b1a8c"/>
  <text x="505" y="110" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">backend · FastAPI</text>
  <rect x="424" y="122" width="162" height="26" rx="6" fill="#7a35b0"/>
  <text x="505" y="140" font-size="11.5" fill="#ffffff" text-anchor="middle">api/ — роли, валидация</text>
  <rect x="424" y="154" width="162" height="56" rx="6" fill="#7a35b0"/>
  <text x="505" y="172" font-size="11.5" fill="#ffffff" text-anchor="middle">services/ — testing, irt,</text>
  <text x="505" y="187" font-size="11.5" fill="#ffffff" text-anchor="middle">matching, nlp, trust,</text>
  <text x="505" y="202" font-size="11.5" fill="#ffffff" text-anchor="middle">webhooks, fsp_client, pdf</text>
  <rect x="424" y="216" width="162" height="26" rx="6" fill="#7a35b0"/>
  <text x="505" y="234" font-size="11.5" fill="#ffffff" text-anchor="middle">models.py — SQLAlchemy</text>

  <!-- postgres -->
  <rect x="624" y="108" width="108" height="64" rx="10" fill="#efe6f8" stroke="#7a35b0"/>
  <text x="678" y="134" font-size="13" font-weight="700" fill="#3d0c63" text-anchor="middle">PostgreSQL 16</text>
  <text x="678" y="153" font-size="11" fill="#6b5c7b" text-anchor="middle">или SQLite</text>

  <!-- fsp-mock -->
  <rect x="240" y="270" width="200" height="80" rx="10" fill="#efe6f8" stroke="#7a35b0"/>
  <text x="340" y="294" font-size="13.5" font-weight="700" fill="#3d0c63" text-anchor="middle">fsp-mock (FastAPI)</text>
  <text x="340" y="313" font-size="11.5" fill="#6b5c7b" text-anchor="middle">OIDC в формате Keycloak</text>
  <text x="340" y="330" font-size="11.5" fill="#6b5c7b" text-anchor="middle">+ API достижений реестра</text>

  <!-- mailpit -->
  <rect x="624" y="214" width="108" height="52" rx="10" fill="#efe6f8" stroke="#7a35b0"/>
  <text x="678" y="236" font-size="13" font-weight="700" fill="#3d0c63" text-anchor="middle">Mailpit</text>
  <text x="678" y="254" font-size="11" fill="#6b5c7b" text-anchor="middle">SMTP, письма</text>

  <!-- внешние -->
  <rect x="240" y="396" width="200" height="56" rx="10" fill="#ffffff" stroke="#8a7a9b" stroke-dasharray="4 3"/>
  <text x="340" y="420" font-size="13" font-weight="700" fill="#4a3d5a" text-anchor="middle">Keycloak ФСП (боевой)</text>
  <text x="340" y="438" font-size="11" fill="#6b5c7b" text-anchor="middle">замена mock сменой FSP_BASE_URL</text>
  <rect x="520" y="396" width="206" height="56" rx="10" fill="#ffffff" stroke="#8a7a9b" stroke-dasharray="4 3"/>
  <text x="623" y="420" font-size="13" font-weight="700" fill="#4a3d5a" text-anchor="middle">ATS работодателя</text>
  <text x="623" y="438" font-size="11" fill="#6b5c7b" text-anchor="middle">вебхуки с HMAC-подписью</text>

  <!-- стрелки -->
  <line x1="190" y1="128" x2="236" y2="128" stroke="#4b0f73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="213" y="120" font-size="10.5" fill="#4b0f73" text-anchor="middle">HTTPS</text>
  <line x1="360" y1="128" x2="406" y2="128" stroke="#4b0f73" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="383" y="120" font-size="10.5" fill="#4b0f73" text-anchor="middle">/api</text>
  <line x1="600" y1="140" x2="620" y2="140" stroke="#4b0f73" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="600" y1="236" x2="620" y2="240" stroke="#4b0f73" stroke-width="1.8" marker-end="url(#arr)"/>
  <path d="M300,182 L300,266" stroke="#4b0f73" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="306" y="232" font-size="10.5" fill="#4b0f73">/fsp: вход ФСП ID</text>
  <path d="M470,254 L470,300 L444,300" stroke="#4b0f73" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="478" y="292" font-size="10.5" fill="#4b0f73">token · userinfo ·</text>
  <text x="478" y="306" font-size="10.5" fill="#4b0f73">achievements</text>
  <line x1="340" y1="350" x2="340" y2="392" stroke="#8a7a9b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <path d="M560,254 L560,376 L623,376 L623,392" stroke="#8a7a9b" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  <text x="568" y="340" font-size="10.5" fill="#6b5c7b">события:</text>
  <text x="568" y="354" font-size="10.5" fill="#6b5c7b">accepted, applied…</text>
</svg>
