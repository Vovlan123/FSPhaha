server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    # $http_host сохраняет порт: mock ФСП ID строит абсолютные ссылки формы входа по заголовку Host
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API и mock ФСП ID — на бэкенд; браузер видит один origin, CORS не нужен
    location /api/ { proxy_pass http://backend:8000; }
    location /fsp/ { proxy_pass http://fsp-mock:8001/; }
    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    # SPA: все остальные пути отдают index.html
    location / { try_files $uri /index.html; }
}
